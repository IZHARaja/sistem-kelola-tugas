{% extends "base.html" %}
{% block title %}404 — Halaman Tidak Ditemukan{% endblock %}
{% block content %}
<div class="auth-container">
    <div class="auth-card" style="text-align: center;">
        <div class="auth-icon" style="color: var(--warning);">
            <i class="fas fa-search"></i>
        </div>
        <h1 style="color: var(--warning); font-size: 3rem; margin-bottom: 0.5rem;">404</h1>
        <p style="font-size: 1.1rem; color: var(--text-primary); margin-bottom: 0.5rem; font-weight: 600;">
            Halaman Tidak Ditemukan
        </p>
        <p style="color: var(--text-secondary); margin-bottom: 2rem;">
            Halaman yang Anda cari tidak ada atau telah dipindahkan.
        </p>
        <a href="{{ url_for('auth.dashboard') }}" class="btn-primary">
            <i class="fas fa-home"></i> Kembali ke Dashboard
        </a>
    </div>
</div>
{% endblock %}
